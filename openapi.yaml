openapi: 3.0.3
info:
  title: Alliora
  version: 0.1.0
  description: >-
    Alliance-and-capability OS for incumbent financial institutions to shop, score,
    contract, and govern fintech partnerships across eight disruptive forces.
  x-product-slug: ai-fin-alliora
  x-source: ai-in-financial/wef_-_beyond_fintech_-_a_pragmatic_assessment_of_disruptive_potential_in_financial_services_-_august_2017/
servers:
  - url: https://api.example.com
tags:
  - name: Capabilities
    description: Capability intake and force taxonomy
  - name: Decisions
    description: Mutualise, externalise, automate, build, invest, decline
  - name: StageGates
    description: Evidence gates and kill or scale outcomes
  - name: ExperienceMaps
    description: Experience ownership and liability maps
  - name: Dependencies
    description: Systemically important tech dependencies
  - name: Alerts
    description: Platform-risk and SIT concentration alerts
  - name: Reports
    description: Executive portfolio reporting
paths:
  /v1/capabilities:
    get:
      operationId: listCapabilities
      tags: [Capabilities]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: force
          in: query
          schema:
            type: string
            enum: [costCommoditization, profitRedistribution, experienceOwnership, platformsRising, dataMonetization, bionicWorkforce, systemicallyImportantTechs, financialRegionalization]
      responses:
        "200":
          description: Capabilities page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCapability"
    post:
      operationId: createCapability
      tags: [Capabilities]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityCreate"
      responses:
        "201":
          description: Capability created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapability"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/capabilities/{capabilityId}:
    parameters:
      - $ref: "#/components/parameters/CapabilityId"
    get:
      operationId: getCapability
      tags: [Capabilities]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapability"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/capabilities/{capabilityId}/force-tags:
    parameters:
      - $ref: "#/components/parameters/CapabilityId"
    post:
      operationId: tagCapabilityForces
      tags: [Capabilities]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forces, valueChainPosition]
              properties:
                forces:
                  type: array
                  items:
                    type: string
                    enum: [costCommoditization, profitRedistribution, experienceOwnership, platformsRising, dataMonetization, bionicWorkforce, systemicallyImportantTechs, financialRegionalization]
                valueChainPosition:
                  type: string
                  enum: [manufacture, distribute, infrastructure, data, labourAugmentation]
      responses:
        "200":
          description: Capability tagged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapability"
  /v1/decisions:
    get:
      operationId: listDecisionClasses
      tags: [Decisions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Decisions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDecisionClass"
    post:
      operationId: recordDecisionClass
      tags: [Decisions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionClassCreate"
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDecisionClass"
  /v1/stage-gates:
    get:
      operationId: listStageGates
      tags: [StageGates]
      security:
        - BearerAuth: []
      parameters:
        - name: capabilityId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Stage gates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeStageGate"
    post:
      operationId: createStageGate
      tags: [StageGates]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageGateCreate"
      responses:
        "201":
          description: Stage gate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStageGate"
  /v1/stage-gates/{gateId}/evidence:
    parameters:
      - $ref: "#/components/parameters/GateId"
    post:
      operationId: submitEvidencePack
      tags: [StageGates]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidencePack"
      responses:
        "201":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEvidencePack"
  /v1/stage-gates/{gateId}/outcome:
    parameters:
      - $ref: "#/components/parameters/GateId"
    post:
      operationId: decideStageGateOutcome
      tags: [StageGates]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [pass, kill, scale, extend]
                rationale: { type: string }
      responses:
        "200":
          description: Gate outcome recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStageGate"
  /v1/experience-maps:
    post:
      operationId: createExperienceOwnershipMap
      tags: [ExperienceMaps]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceOwnershipMap"
      responses:
        "201":
          description: Experience map created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExperienceOwnershipMap"
  /v1/experience-maps/{mapId}/liability:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      operationId: attachLiabilityTerms
      tags: [ExperienceMaps]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiabilityTerms"
      responses:
        "200":
          description: Liability terms attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExperienceOwnershipMap"
  /v1/profit-pool-hypotheses:
    post:
      operationId: createProfitPoolHypothesis
      tags: [Decisions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfitPoolHypothesis"
      responses:
        "201":
          description: Hypothesis recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProfitPoolHypothesis"
  /v1/dependencies:
    get:
      operationId: listSitDependencies
      tags: [Dependencies]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: SIT dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSitDependency"
    post:
      operationId: registerSitDependency
      tags: [Dependencies]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitDependency"
      responses:
        "201":
          description: Dependency registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSitDependency"
  /v1/alerts:
    get:
      operationId: listPlatformRiskAlerts
      tags: [Alerts]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, closed]
      responses:
        "200":
          description: Alerts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePlatformRiskAlert"
    post:
      operationId: raisePlatformRiskAlert
      tags: [Alerts]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformRiskAlertCreate"
      responses:
        "201":
          description: Alert raised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePlatformRiskAlert"
  /v1/reports/portfolio:
    get:
      operationId: getPortfolioReport
      tags: [Reports]
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema: { type: string, example: "2026-Q3" }
      responses:
        "200":
          description: Executive portfolio report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePortfolioReport"
  /v1/regional-constraints:
    post:
      operationId: createRegionalConstraint
      tags: [Capabilities]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionalConstraint"
      responses:
        "201":
          description: Regional constraint saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRegionalConstraint"
components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      schema: { type: string }
    GateId:
      name: gateId
      in: path
      required: true
      schema: { type: string }
    MapId:
      name: mapId
      in: path
      required: true
      schema: { type: string }
  responses:

    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Capability:
      type: object
      required: [id, name, sourceType, status]
      properties:
        id: { type: string }
        name: { type: string }
        sourceType:
          type: string
          enum: [fintech, utility, internalBuild, acquisition]
        status:
          type: string
          enum: [intake, tagged, inPilot, scaled, killed]
        forces:
          type: array
          items:
            type: string
        valueChainPosition: { type: string }
        economicOwner: { type: string }
    CapabilityCreate:
      type: object
      required: [name, sourceType, economicOwner]
      properties:
        name: { type: string }
        sourceType:
          type: string
          enum: [fintech, utility, internalBuild, acquisition]
        economicOwner: { type: string }
        vendorName: { type: string }
    ForceTag:
      type: object
      required: [force]
      properties:
        force:
          type: string
          enum: [costCommoditization, profitRedistribution, experienceOwnership, platformsRising, dataMonetization, bionicWorkforce, systemicallyImportantTechs, financialRegionalization]
        primary: { type: boolean }
    ValueChainPosition:
      type: object
      required: [position]
      properties:
        position:
          type: string
          enum: [manufacture, distribute, infrastructure, data, labourAugmentation]
    DecisionClass:
      type: object
      required: [id, capabilityId, decision, decidedAt]
      properties:
        id: { type: string }
        capabilityId: { type: string }
        decision:
          type: string
          enum: [mutualise, externalise, automate, build, invest, decline]
        economicOwner: { type: string }
        decidedAt: { type: string, format: date-time }
    DecisionClassCreate:
      type: object
      required: [capabilityId, decision, economicOwner]
      properties:
        capabilityId: { type: string }
        decision:
          type: string
          enum: [mutualise, externalise, automate, build, invest, decline]
        economicOwner: { type: string }
    StageGate:
      type: object
      required: [id, capabilityId, dayMarker, status]
      properties:
        id: { type: string }
        capabilityId: { type: string }
        dayMarker:
          type: integer
          enum: [30, 90, 180]
        status:
          type: string
          enum: [pending, pass, kill, scale, extend]
        outcomeRationale: { type: string }
    StageGateCreate:
      type: object
      required: [capabilityId, dayMarker]
      properties:
        capabilityId: { type: string }
        dayMarker:
          type: integer
          enum: [30, 90, 180]
    EvidencePack:
      type: object
      required: [id, gateId, switchingMateriality, unitEconomicsPass]
      properties:
        id: { type: string }
        gateId: { type: string }
        switchingMateriality: { type: boolean }
        unitEconomicsPass: { type: boolean }
        operationalRiskNotes: { type: string }
        attachedAt: { type: string, format: date-time }
    ExperienceOwnershipMap:
      type: object
      required: [id, capabilityId, uxOwner, brandOwner, dataOwner, complaintsOwner]
      properties:
        id: { type: string }
        capabilityId: { type: string }
        uxOwner:
          type: string
          enum: [bank, partner]
        brandOwner:
          type: string
          enum: [bank, partner, coBrand]
        dataOwner:
          type: string
          enum: [bank, partner, shared]
        complaintsOwner:
          type: string
          enum: [bank, partner]
        liabilityTermsId: { type: string }
    LiabilityTerms:
      type: object
      required: [id, manufacturerLiability, distributorLiability, signed]
      properties:
        id: { type: string }
        manufacturerLiability: { type: string }
        distributorLiability: { type: string }
        signed: { type: boolean }
    ProfitPoolHypothesis:
      type: object
      required: [id, capabilityId, whoGains, whoLoses]
      properties:
        id: { type: string }
        capabilityId: { type: string }
        whoGains: { type: string }
        whoLoses: { type: string }
        tested: { type: boolean }
        resultNotes: { type: string }
    PartnershipContract:
      type: object
      required: [id, capabilityId, status]
      properties:
        id: { type: string }
        capabilityId: { type: string }
        status:
          type: string
          enum: [draft, executed, terminated]
        experienceMapId: { type: string }
    SitDependency:
      type: object
      required: [id, vendorName, capabilityArea, concentrationScore, exitPlanPresent]
      properties:
        id: { type: string }
        vendorName: { type: string }
        capabilityArea: { type: string }
        concentrationScore: { type: number, format: float }
        exitPlanPresent: { type: boolean }
        boardVisible: { type: boolean }
    PlatformRiskAlert:
      type: object
      required: [id, capabilityId, severity, status, raisedAt]
      properties:
        id: { type: string }
        capabilityId: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, acknowledged, closed]
        detail: { type: string }
        raisedAt: { type: string, format: date-time }
    PlatformRiskAlertCreate:
      type: object
      required: [capabilityId, severity, detail]
      properties:
        capabilityId: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
        detail: { type: string }
    RegionalConstraint:
      type: object
      required: [id, capabilityId, region, constraintType]
      properties:
        id: { type: string }
        capabilityId: { type: string }
        region: { type: string }
        constraintType:
          type: string
          enum: [licence, dataResidency, conduct]
        blocksCopyPaste: { type: boolean }
    PortfolioReport:
      type: object
      required: [period, capabilityCount, killRate, sitConcentrationIndex]
      properties:
        period: { type: string }
        capabilityCount: { type: integer }
        killRate: { type: number, format: float }
        scaleRate: { type: number, format: float }
        forceCoverage:
          type: object
          additionalProperties:
            type: integer
        sitConcentrationIndex: { type: number, format: float }
        openPlatformAlerts: { type: integer }

    DataEnvelopeCapability:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Capability"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeCapability:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Capability"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeDecisionClass:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DecisionClass"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeDecisionClass:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DecisionClass"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeStageGate:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/StageGate"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeStageGate:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StageGate"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeEvidencePack:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/EvidencePack"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeEvidencePack:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EvidencePack"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeExperienceOwnershipMap:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ExperienceOwnershipMap"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeExperienceOwnershipMap:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ExperienceOwnershipMap"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeProfitPoolHypothesis:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ProfitPoolHypothesis"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeProfitPoolHypothesis:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProfitPoolHypothesis"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeSitDependency:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SitDependency"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeSitDependency:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SitDependency"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopePlatformRiskAlert:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/PlatformRiskAlert"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopePlatformRiskAlert:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PlatformRiskAlert"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopePortfolioReport:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/PortfolioReport"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopePortfolioReport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioReport"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeRegionalConstraint:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/RegionalConstraint"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeRegionalConstraint:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RegionalConstraint"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

